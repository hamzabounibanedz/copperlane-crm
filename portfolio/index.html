<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202d31"><title>Copperlane CRM | Sales pipeline</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23202d31'/%3E%3Cpath d='M29 10H19a10 10 0 100 20h10M28 16h-9a4 4 0 100 8h9' fill='none' stroke='%23eca278' stroke-width='3'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#202d31;font:16px/1.45 "Segoe UI",Arial,sans-serif}header{background:#202d31;color:white;padding:16px clamp(18px,5vw,70px);display:flex;gap:16px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:650}.brand svg{width:34px;height:34px}.demo{font-size:13px;color:#ffdcc7}main{max-width:1400px;margin:auto;padding:clamp(24px,5vw,72px)}h1{font:500 clamp(40px,6vw,83px)/1.08 Georgia,serif;letter-spacing:-.055em;margin:0 0 12px}h2{font-size:18px;margin:0}header p, main p{margin:0}.sub{color:#506167}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin:30px 0 19px;padding:18px 0;border-block:1px solid #c4c8c3}label{display:grid;gap:5px;font-weight:600;font-size:13px}input,select,button{font:inherit;color:inherit}input,select{border:1px solid #a0aba6;border-radius:5px;background:white;padding:9px 12px}input{width:min(280px,78vw)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.lane{background:#e7e9e5;border-radius:7px;padding:15px;min-height:255px}.lanehead{display:flex;align-items:center;justify-content:space-between;border-top:3px solid #768e91;padding:10px 0 14px}.lane:nth-child(2) .lanehead{border-color:#bc7555}.lane:nth-child(3) .lanehead{border-color:#647f5d}.card{display:grid;gap:8px;width:100%;text-align:left;padding:15px;background:#fff;border:1px solid #c9d0ca;border-radius:5px;margin-bottom:9px;cursor:pointer}.card:hover{border-color:#865539}.card strong{font-size:17px}.card span,.empty{font-size:14px;color:#4c605d}.card b{font-size:14px;color:#7d442e}dialog{color:inherit;border:1px solid #b7c2bb;border-radius:10px;padding:26px;width:min(410px,90vw)}dialog::backdrop{background:#15262b80}dialog h2{font:32px Georgia,serif;margin:0 0 14px}dialog p{margin:6px 0}dialog label{margin:18px 0}.close{background:#233b39;color:white;border:0;border-radius:5px;padding:9px 18px;cursor:pointer}:focus-visible{outline:3px solid #a65129;outline-offset:3px}@media(max-width:700px){.board{grid-template-columns:1fr}.lane{min-height:unset}.toolbar{align-items:start}.demo{text-align:right}}
</style></head><body><header><div class="brand"><svg aria-hidden="true" viewBox="0 0 40 40"><path d="M29 10H19a10 10 0 100 20h10M28 16h-9a4 4 0 100 8h9" fill="none" stroke="#eca278" stroke-width="3"/></svg>Copperlane</div><span class="demo">Portfolio demo · Sample CRM records</span></header><main><h1>Sales pipeline</h1><p class="sub">Open a deal to see its contact, next step, or change its stage. Changes last until you reload.</p><div class="toolbar"><label for="search">Search deals<input type="search" id="search" placeholder="Company or contact"></label><p id="summary" aria-live="polite"></p></div><section class="board" id="board" aria-label="Deals by stage"></section></main>
<dialog id="detail"><h2 id="company"></h2><p id="person"></p><p id="amount"></p><p id="next"></p><label>Deal stage<select id="stage"></select></label><button class="close" id="close" type="button">Close deal</button></dialog>
<script>
const stages=['Discovery','Proposal','Won'];
const deals=[
 ['Morrow Editions','Iris Bell',8400,0,'Review the print schedule.'],
 ['Tern Cycleworks','Kai Moss',6050,0,'Meet the purchasing team.'],
 ['Copperleaf Interiors','Ada Lane',12800,1,'Send the revised estimate.'],
 ['Sunday Workshop','Noor West',4500,1,'Confirm the installation dates.'],
 ['North Pier Press','Remi Park',9200,2,'Arrange the handover.'],
 ['Fold Studio','Alex Gray',3700,2,'Book the kickoff call.']
].map(([company,contact,value,stage,next])=>({company,contact,value,stage,next}));
const el=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n);
const node=(tag,txt)=>{const element=document.createElement(tag);element.textContent=txt;return element};
let active,opener;
function render(){
 const query=el('search').value.trim().toLowerCase();
 const visible=deals.filter(d=>(d.company+' '+d.contact).toLowerCase().includes(query));
 el('summary').textContent=visible.length+' deals · '+money(visible.reduce((total,d)=>total+d.value,0));
 el('board').replaceChildren(...stages.map((stage,i)=>{
  const lane=node('section','');lane.className='lane';
  const rows=visible.filter(d=>d.stage===i),heading=node('div','');heading.className='lanehead';
  heading.append(node('h2',stage),node('span',String(rows.length)));lane.append(heading);
  for(const item of rows){const card=node('button','');card.type='button';card.className='card';card.append(node('strong',item.company),node('span',item.contact),node('b',money(item.value)));card.onclick=()=>openDeal(item,card);lane.append(card);}
  if(!rows.length){const empty=node('p','No matching deals');empty.className='empty';lane.append(empty)}return lane;
 }));
}
function openDeal(item,button){
 active=item;opener=button;el('company').textContent=item.company;el('person').textContent='Contact · '+item.contact;el('amount').textContent='Deal value · '+money(item.value);el('next').textContent='Next step · '+item.next;el('stage').value=String(item.stage);el('detail').showModal();
}
stages.forEach((s,i)=>el('stage').add(new Option(s,i)));
el('stage').onchange=()=>{active.stage=Number(el('stage').value);render()};
el('close').onclick=()=>el('detail').close();
el('detail').onclose=()=>{const btn=[...el('board').querySelectorAll('button')].find(b=>b.firstChild.textContent===active.company);(btn||el('search')).focus()};
el('search').oninput=render;render();
</script></body></html>
